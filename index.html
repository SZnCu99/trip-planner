<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paris Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: day tabs on top, then itinerary timeline (left) beside a sticky hand-drawn map of Paris (right); stacks on phones. */
:root {
  --bg: #f3f4f1;          /* limestone, faintly green */
  --surface: #ffffff;
  --ink: #18201d;
  --muted: #5d6863;
  --line: #d9ddd7;
  --accent: #1f5b4a;      /* Paris bench / kiosk green */
  --accent-ink: #ffffff;
  --map-land: #e9ebe4;
  --map-arr: #c9cfc6;
  --map-label: #9aa39c;
  --water: #9cc3d3;
  --font-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --font-body: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121715; --surface: #1a211e; --ink: #e8ece8; --muted: #9ba7a1; --line: #2c3632;
    --accent: #6fbf9f; --accent-ink: #0c1411;
    --map-land: #1f2724; --map-arr: #34403b; --map-label: #5c6a64; --water: #2c5566;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121715; --surface: #1a211e; --ink: #e8ece8; --muted: #9ba7a1; --line: #2c3632;
  --accent: #6fbf9f; --accent-ink: #0c1411;
  --map-land: #1f2724; --map-arr: #34403b; --map-label: #5c6a64; --water: #2c5566;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 900px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 56px; display: grid; gap: 22px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 6vw, 54px); line-height: 1.02; margin: 0; text-wrap: balance; }
h1 em { font-weight: 500; color: var(--accent); }
.hotel { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); min-width: 0; }
.hotel b { color: var(--ink); font-weight: 500; }
.hpin { flex: none; width: 28px; height: 28px; border-radius: 6px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.sample { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; margin: 0; }

nav.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 8px; }
@media (max-width: 520px) { nav.days { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
nav.days button { min-width: 0; font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 8px 16px 8px 8px; display: flex; align-items: center; gap: 10px; text-align: left; }
nav.days button .n { width: 30px; height: 30px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-weight: 600; font-variant-numeric: tabular-nums; }
nav.days button .n { flex: none; }
nav.days button .t { display: grid; line-height: 1.15; min-width: 0; }
nav.days button .t small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav.days button { border-radius: 14px; padding: 8px 12px 8px 8px; }
nav.days button .t small { color: var(--muted); font-size: 12px; }
nav.days button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
nav.days button[aria-selected="true"] .n { background: var(--accent-ink); color: var(--accent); }
nav.days button[aria-selected="true"] .t small { color: inherit; opacity: .8; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; max-width: 860px; width: 100%; margin: 0 auto; }

.dayhead { display: grid; gap: 2px; margin-bottom: 14px; }
.dayhead h2 { font-family: var(--font-display); font-weight: 500; font-style: italic; font-size: 30px; line-height: 1.1; margin: 0; text-wrap: balance; }
.dayhead p { margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

ol.tl { list-style: none; margin: 0; padding: 0; display: grid; }
.ev { display: grid; grid-template-columns: 56px 36px minmax(0, 1fr); column-gap: 10px; }
@media (max-width: 480px) { .ev { grid-template-columns: 46px 30px minmax(0, 1fr); column-gap: 8px; } .time { font-size: 14px; } .body h3 { font-size: 17px; } .dot { width: 26px; height: 26px; } }
.time { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; padding-top: 6px; text-align: right; }
.time small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.rail { position: relative; display: flex; justify-content: center; }
.rail::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; transform: translateX(-1px); background: var(--line); }
.ev:first-child .rail::before { top: 18px; }
.ev:last-child .rail::before { bottom: calc(100% - 18px); }
.dot { position: relative; z-index: 1; margin-top: 4px; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.dot.h { border-radius: 6px; }
.dot.open, .dot.tbd { background: var(--bg); color: var(--muted); border: 2px dashed var(--muted); }
.body h3.muted { color: var(--muted); font-style: italic; font-weight: 400; }
.pin.tbd { background: #fff; color: #5d6863; border: 2px dashed #5d6863; }
.body { padding-block: 4px 18px; min-width: 0; }
.stop { cursor: pointer; border-radius: 10px; padding: 2px 8px 6px; margin-left: -8px; transition: background .15s; }
.stop:hover, .stop.hl { background: var(--surface); }
.stop.hl .dot, .ev.hl .dot { background: var(--accent); color: var(--accent-ink); }
.body h3 { margin: 0; font-size: 18px; font-weight: 500; line-height: 1.3; }
.body .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.body .note { margin: 4px 0 0; font-size: 14px; max-width: 60ch; }

.leg .rail .glyph { position: relative; z-index: 1; margin-top: 6px; }
.leg .body { padding-block: 6px 16px; }
.legcard { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 14px; color: var(--muted); }
.legcard .how { color: var(--ink); }
.legcard a { color: var(--accent); font-size: 13px; text-decoration: none; border-bottom: 1px solid currentColor; }
.badge { flex: none; white-space: nowrap; display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 5px; border-radius: 12px; font-size: 13px; font-weight: 600; line-height: 1; }
.badge.walk { background: var(--bg); border: 1px dashed var(--muted); color: var(--muted); }
.badge.bus { border-radius: 4px; background: #2f6fb3; color: #fff; }
.badge.rer { border-radius: 5px; }
.mins { font-variant-numeric: tabular-nums; white-space: nowrap; }

.mapcol { display: grid; gap: 10px; }
.maphead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.maphead h2 { font-family: var(--font-display); font-weight: 500; font-style: italic; font-size: 24px; margin: 0; }
.gmaps { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 500; font-size: 15px; padding: 10px 16px; border-radius: 10px; }
.gmaps:hover { filter: brightness(1.08); }
.mapbox { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; }
@media (max-width: 600px) { .mapbox { aspect-ratio: 1 / 1; } }
#map { position: absolute; inset: 0; background: var(--bg); }
.mapbox .ctrls { z-index: 500; }
.pin { width: 28px; height: 28px; border-radius: 50%; background: #18201d; color: #fff; border: 2px solid #fff; display: grid; place-items: center; font: 600 13px/1 var(--font-body); box-shadow: 0 1px 4px rgba(0,0,0,.35); cursor: pointer; transition: transform .15s; }
.pin.h { border-radius: 7px; }
.pin.hl { background: var(--accent); color: var(--accent-ink); transform: scale(1.25); }
.leaflet-div-icon { background: none; border: 0; }
.maptip { margin: 0; font-size: 13px; color: var(--muted); }
.linkbtn { font: inherit; background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
#map { display: block; background: var(--bg); width: 100%; height: 100%; touch-action: none; cursor: grab; }
#map.drag { cursor: grabbing; }
.ctrls { position: absolute; top: 10px; right: 10px; display: grid; gap: 6px; }
.ctrls button { font: inherit; font-size: 16px; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.ctrls button.wide { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--ink); }
.legend i.w { border-top: 3px dotted var(--muted); }

svg text { font-family: var(--font-body); }
.arr { fill: var(--map-land); stroke: var(--map-arr); }
.arrlbl { fill: var(--map-label); font-weight: 500; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.water { fill: none; stroke: var(--water); stroke-linecap: round; stroke-linejoin: round; }
.mk { cursor: pointer; }
.mk circle, .mk rect { fill: var(--ink); stroke: var(--surface); }
.mk text { fill: var(--surface); font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.mk.hl circle, .mk.hl rect { fill: var(--accent); }
.mk.hl text { fill: var(--accent-ink); }
.mklbl { fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-linejoin: round; font-weight: 500; pointer-events: none; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow" id="dates"></p>
      <h1 id="title"></h1>
    </div>
    <div class="hotel"><span class="hpin">H</span><span id="hotel"></span></div>
  </header>
  <p class="sample" id="sample" hidden>This day is still a sample. Tell Claude your plans for it and it will be replaced.</p>

  <nav class="days" id="days" role="tablist" aria-label="Trip days"></nav>

  <main>
    <section aria-live="polite">
      <div class="dayhead"><h2 id="dayTitle"></h2><p id="daySum"></p></div>
      <ol class="tl" id="tl"></ol>
    </section>
    <aside class="mapcol">
      <div class="maphead">
        <h2>Today on the map</h2>
        <a class="gmaps" id="gmaps" href="#" target="_blank" rel="noopener">Open this day in Google Maps ↗</a>
      </div>
      <div class="mapbox">
        <div id="map" role="region" aria-label="Map of this day's stops"></div>
        <div class="ctrls"><button id="zfit" class="wide" type="button" aria-label="Show all of this day's stops">Fit</button></div>
      </div>
      <div class="legend">
        <span><i></i>Metro / RER / bus (line colour)</span>
        <span><i class="w"></i>Walk</span>
        <span>Lines connect stops in order; they are not the exact street route.</span>
      </div>
    </aside>
  </main>
</div>

<script>
/* ============================================================
   YOUR TRIP — edit this object to change everything on the page.
   Times are calculated for you: each day starts at `start`,
   then adds each leg's `min` (travel) and each stop's `stay`.
   modes: "metro" | "rer" | "bus" | "walk"
   ============================================================ */
const TRIP = {
  title: "Paris",
  startDate: "2026-10-10",   // Day 1
  isSample: true,
  hotel: { name: "Hôtel Armoni", area: "7 Villa Berthier, 17e · near Porte de Champerret (Metro 3)", gq: "Hôtel Armoni, 7 Villa Berthier, 75017 Paris", lat: 48.8869, lon: 2.2957 },
  days: [
    {
      title: "Arrival & the Palais",
      from: { name: "Gare du Nord", label: "Arrive at Gare du Nord", note: "Eurostar arrives 15:02", pin: "GN", lat: 48.8809, lon: 2.3553 },
      start: "15:02",
      stops: [
        { hotel: true, name: "Hôtel Armoni: check in & rest", stay: 45,
          go: { mode: "metro", line: "2", min: 40, from: "La Chapelle", to: "Villiers", how: "then Metro 3 to Porte de Champerret, walk 5 min" },
          note: "Time includes about 10 min to get off the Eurostar and walk to La Chapelle (linked to Gare du Nord). With luggage, a taxi takes about 25 min." },
        { name: "Petit Palais", lat: 48.8660, lon: 2.3146, stay: 60,
          go: { mode: "metro", line: "3", min: 30, from: "Porte de Champerret", to: "Saint-Lazare", how: "then Metro 13 to Champs-Élysées–Clemenceau" },
          note: "Free permanent collection and a lovely garden café. Open Tue–Sun 10:00–18:00 (so open on Saturday), and it comes before the Grand Palais because it closes first." },
        { name: "Grand Palais", lat: 48.8661, lon: 2.3124, stay: 30,
          go: { mode: "walk", min: 3, how: "Cross Avenue Winston-Churchill" },
          note: "Reopened in 2025 after its renovation. Check what's on in the glass nave and book exhibitions online." },
        { name: "La Pie Noir (dinner)", gq: "La Pie Noir, 5 Rue de la Montagne Sainte-Geneviève, Paris", lat: 48.8498, lon: 2.3487, at: "19:00", stay: 90,
          go: { mode: "metro", line: "13", min: 30, from: "Champs-Élysées–Clemenceau", to: "Invalides", how: "then RER C to Saint-Michel Notre-Dame, walk 8 min" },
          note: "5 Rue de la Montagne Sainte-Geneviève, 5e. Dinner from 18:30 on Saturdays (closed Sundays and Mondays). Book ahead." }
      ],
      back: { mode: "rer", line: "C", min: 45, from: "Saint-Michel Notre-Dame", to: "Pereire–Levallois", how: "train toward Pontoise; walk 8 min to the station and 10 min to the hotel" }
    },
    {
      title: "Brunch & the Louvre",
      start: "09:00",
      stops: [
        { name: "Brunch (place not decided yet)", tbd: true, gq: "Palais-Royal, Paris", lat: 48.8638, lon: 2.3370, stay: 75,
          go: { mode: "metro", line: "3", min: 30, from: "Porte de Champerret", to: "Opéra", how: "then Metro 7 to Palais Royal–Musée du Louvre" },
          note: "Placeholder near the Louvre so the timing works. Pick a spot around Palais-Royal or Rue Saint-Honoré and tell Claude." },
        { name: "Musée du Louvre", lat: 48.8606, lon: 2.3376, at: "11:00", stay: 180,
          go: { mode: "walk", min: 8, how: "Walk through the Palais-Royal gardens" },
          note: "Timed entry at 11:00; book on the Louvre website. Open on Sundays (closed Tuesdays)." }
      ],
      open: "The rest of the day is still open."
    },
    {
      title: "Opéra & Montmartre",
      sample: true,
      start: "09:30",
      stops: [
        { name: "Palais Garnier", lat: 48.8720, lon: 2.3316, stay: 75,
          go: { mode: "metro", line: "8", min: 20, from: "Bastille", to: "Opéra", how: "Walk 5 min to Bastille first" },
          note: "Self-guided visit; the Chagall ceiling is in the auditorium." },
        { name: "Galeries Lafayette rooftop", lat: 48.8738, lon: 2.3320, stay: 60,
          go: { mode: "walk", min: 4, how: "Walk up Boulevard Haussmann" },
          note: "Free rooftop terrace, open during store hours." },
        { name: "Abbesses (lunch)", gq: "Place des Abbesses, Paris", lat: 48.8845, lon: 2.3385, stay: 60,
          go: { mode: "metro", line: "12", min: 18, from: "Trinité–d'Estienne d'Orves", to: "Abbesses" },
          note: "Abbesses is a deep station: take the lift, not the 200 stairs." },
        { name: "Sacré-Cœur", lat: 48.8867, lon: 2.3431, stay: 60,
          go: { mode: "walk", min: 8, how: "Walk up, or take the funicular with a metro ticket" } },
        { name: "Place du Tertre", lat: 48.8865, lon: 2.3408, stay: 40,
          go: { mode: "walk", min: 3, how: "Walk along Rue Norvins" } },
        { name: "Dinner in South Pigalle", gq: "Rue des Martyrs, Paris", lat: 48.8800, lon: 2.3375, stay: 90,
          go: { mode: "walk", min: 14, how: "Walk down past the Moulin Rouge" } }
      ],
      back: { mode: "metro", line: "12", min: 30, from: "Pigalle", to: "Concorde", how: "then line 1 to Saint-Paul" }
    },
    {
      title: "Le Marais & Canal Saint-Martin",
      sample: true,
      start: "10:00",
      stops: [
        { name: "Place des Vosges", lat: 48.8556, lon: 2.3655, stay: 30,
          go: { mode: "walk", min: 6, how: "Walk along Rue Saint-Antoine" },
          note: "Victor Hugo's house is in the corner, free to visit." },
        { name: "Musée Picasso", lat: 48.8598, lon: 2.3622, stay: 90,
          go: { mode: "walk", min: 7, how: "Walk up Rue de Turenne" } },
        { name: "Marché des Enfants Rouges", lat: 48.8628, lon: 2.3618, stay: 60,
          go: { mode: "walk", min: 5, how: "Walk to Rue de Bretagne" },
          note: "Oldest covered market in Paris. Get there before 12:30 for a seat." },
        { name: "Centre Pompidou", lat: 48.8607, lon: 2.3522, stay: 120,
          go: { mode: "walk", min: 12, how: "Walk via Rue Rambuteau" },
          note: "Check opening status: the building is closing for renovation in stages." },
        { name: "Canal Saint-Martin", lat: 48.8710, lon: 2.3650, stay: 75,
          go: { mode: "metro", line: "11", min: 15, from: "Rambuteau", to: "République", how: "then walk 8 min" },
          note: "Walk the iron footbridges; picnic on the quai at sunset." }
      ],
      back: { mode: "metro", line: "5", min: 22, from: "Jacques Bonsergent", to: "Bastille", how: "then walk 6 min" }
    }
  ]
};

/* Google Maps API key for the base map. Paste yours between the quotes and
   restrict it to https://szncu99.github.io/* in Google Cloud Console.
   Leave it empty to use a free OpenStreetMap base map instead. */
const GOOGLE_MAPS_API_KEY = "AIzaSyDbzsB2xaHjJsl-DtRtWanO5R-bkIJkNyA";
const GOOGLE_MAP_ID = "DEMO_MAP_ID";

/* Official RATP line colours */
const LINE_COLORS = {
  "1": ["#FFCD00", "#1a1a1a"], "2": ["#003CA6", "#fff"], "3": ["#837902", "#fff"], "4": ["#CF009E", "#fff"],
  "5": ["#FF7E2E", "#1a1a1a"], "6": ["#6ECA97", "#1a1a1a"], "7": ["#FA9ABA", "#1a1a1a"], "8": ["#E19BDF", "#1a1a1a"],
  "9": ["#B6BD00", "#1a1a1a"], "10": ["#C9910D", "#1a1a1a"], "11": ["#704B1C", "#fff"], "12": ["#007852", "#fff"],
  "13": ["#6EC4E8", "#1a1a1a"], "14": ["#62259D", "#fff"],
  "A": ["#E2231A", "#fff"], "B": ["#7BA3DC", "#1a1a1a"], "C": ["#F3D311", "#1a1a1a"], "D": ["#00814F", "#fff"], "E": ["#C04191", "#fff"]
};

/* A stop with `hotel: true` is the hotel itself (e.g. dropping bags mid-day). */
TRIP.days.forEach(d => { d.stops = d.stops.map(st => st.hotel ? { ...st, lat: TRIP.hotel.lat, lon: TRIP.hotel.lon } : st); });
const stopLabel = (day, i) => day.stops[i].hotel ? "H" : String(day.stops.slice(0, i + 1).filter(x => !x.hotel).length);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const fmt = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
const dur = m => m < 60 ? m + " min" : Math.floor(m / 60) + " h" + (m % 60 ? " " + (m % 60) : "");
const MODE_WORD = { metro: "Metro", rer: "RER", bus: "Bus", walk: "Walk" };
const dirUrl = (a, b, mode) => `https://www.google.com/maps/dir/?api=1&origin=${a.lat},${a.lon}&destination=${b.lat},${b.lon}&travelmode=${mode === "walk" ? "walking" : "transit"}`;
const routeUrl = pts => "https://www.google.com/maps/dir/" + pts.map(p => encodeURIComponent(p.gq || p.name + ", Paris")).join("/");
const placeUrl = p => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name + " Paris")}`;

function legColor(go) {
  if (go.mode === "walk") return null;
  if (go.mode === "bus") return "#2f6fb3";
  return (LINE_COLORS[go.line] || ["#555", "#fff"])[0];
}
function badge(go) {
  if (go.mode === "walk") return `<span class="badge walk" title="Walk">⋯</span>`;
  if (go.mode === "bus") return `<span class="badge bus" title="Bus ${esc(go.line)}">${esc(go.line || "Bus")}</span>`;
  const [bg, fg] = LINE_COLORS[go.line] || ["#555", "#fff"];
  return `<span class="badge ${go.mode}" style="background:${bg};color:${fg}" title="${MODE_WORD[go.mode]} ${esc(go.line)}">${go.mode === "rer" ? "RER " : ""}${esc(go.line)}</span>`;
}

/* Build the schedule for a day: hotel → stops → hotel, with clock times */
function schedule(day) {
  const H = TRIP.hotel;
  let t = toMin(day.start);
  const F = day.from;
  const rows = [F ? { type: "start", label: F.label || F.name, note: F.note, t, place: F } : { type: "hotel", label: "Depart hotel", t, place: H }];
  let prev = F || H;
  day.stops.forEach((s, i) => {
    if (s.at) {                       // fixed arrival time: stay longer at the previous stop
      const dep = toMin(s.at) - s.go.min, last = rows[rows.length - 1];
      if (dep > t) { if (last.type === "stop") last.until = dep; t = dep; }
    }
    rows.push({ type: "leg", go: s.go, from: prev, to: s, t });
    t += s.go.min;
    rows.push({ type: "stop", n: i + 1, label: stopLabel(day, i), stop: s, t, until: t + s.stay });
    t = rows[rows.length - 1].until = t + s.stay;
    prev = s;
  });
  if (day.open) rows.push({ type: "open", label: day.open, t });
  if (day.back) {
    rows.push({ type: "leg", go: day.back, from: prev, to: H, t });
    t += day.back.min;
    rows.push({ type: "hotel", label: "Back at hotel", t, place: H });
  }
  return rows;
}

/* ---------- header + tabs ---------- */
$("#title").innerHTML = esc(TRIP.title) + " <em>itinerary</em>";
const dayDate = i => { const [y, m, d] = TRIP.startDate.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d + i)); };
const fmtDate = (dt, opts) => dt.toLocaleDateString("en-GB", { timeZone: "UTC", ...opts });
$("#dates").textContent = fmtDate(dayDate(0), { day: "numeric" }) + "–" + fmtDate(dayDate(TRIP.days.length - 1), { day: "numeric", month: "long", year: "numeric" });
$("#hotel").innerHTML = `<b>${esc(TRIP.hotel.name)}</b><br>${esc(TRIP.hotel.area || "")}`;


const tabs = $("#days");
TRIP.days.forEach((d, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.id = "tab" + i; b.setAttribute("role", "tab");
  b.innerHTML = `<span class="n">${i + 1}</span><span class="t">Day ${i + 1} · ${fmtDate(dayDate(i), { weekday: "short", day: "numeric", month: "short" })}<small>${esc(d.title)}</small></span>`;
  b.addEventListener("click", () => select(i));
  tabs.appendChild(b);
});
tabs.addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const n = TRIP.days.length, i = (cur + (e.key === "ArrowRight" ? 1 : n - 1)) % n;
  select(i); $("#tab" + i).focus();
});

/* ---------- timeline ---------- */
function renderTimeline(day) {
  const rows = schedule(day);
  const stops = day.stops.filter(x => !x.hotel).length, travel = rows.filter(r => r.type === "leg").reduce((a, r) => a + r.go.min, 0);
  $("#dayTitle").textContent = day.title;
  const di = TRIP.days.indexOf(day);
  $("#daySum").textContent = `${fmtDate(dayDate(di), { weekday: "long", day: "numeric", month: "long" })} · ${fmt(rows[0].t)} – ${fmt(rows[rows.length - 1].t)} · ${stops} stops · ${dur(travel)} getting around`;
  $("#tl").innerHTML = rows.map(r => {
    if (r.type === "hotel") return `
      <li class="ev"><div class="time">${fmt(r.t)}</div><div class="rail"><span class="dot h">H</span></div>
      <div class="body"><h3>${esc(r.label)}</h3><div class="meta">${esc(TRIP.hotel.name)}</div></div></li>`;
    if (r.type === "open") return `
      <li class="ev"><div class="time"></div><div class="rail"><span class="dot open">…</span></div>
      <div class="body"><h3 class="muted">${esc(r.label)}</h3><div class="meta">Tell Claude what you'd like to add.</div></div></li>`;
    if (r.type === "start") return `
      <li class="ev"><div class="time">${fmt(r.t)}</div><div class="rail"><span class="dot h">${esc(r.place.pin || "▸")}</span></div>
      <div class="body"><h3>${esc(r.label)}</h3>${r.note ? `<div class="meta">${esc(r.note)}</div>` : ""}</div></li>`;
    if (r.type === "leg") {
      const g = r.go;
      const route = g.from ? `${esc(g.from)} → ${esc(g.to)}` : esc(g.how || "Walk");
      const extra = g.from && g.how ? ` · ${esc(g.how)}` : "";
      return `
      <li class="ev leg"><div class="time"></div><div class="rail"><span class="glyph">${badge(g)}</span></div>
      <div class="body"><div class="legcard"><span class="how">${MODE_WORD[g.mode]}${g.line && g.mode !== "walk" ? " " + esc(g.line) : ""}</span>
      <span>${route}${extra}</span><span class="mins">${g.min} min</span>
      <a href="${dirUrl(r.from, r.to, g.mode)}" target="_blank" rel="noopener">Directions</a></div></div></li>`;
    }
    const s = r.stop, fixed = s.at ? " · booked for " + s.at : "";
    return `
      <li class="ev"><div class="time">${fmt(r.t)}<small>arrive</small></div><div class="rail"><span class="dot${s.hotel ? " h" : ""}${s.tbd ? " tbd" : ""}">${r.label}</span></div>
      <div class="body"><div class="stop" data-n="${r.n}" tabindex="0">
        <h3>${esc(s.name)}</h3>
        <div class="meta">${dur(r.until - r.t)} here${fixed} · leave at ${fmt(r.until)} · <a href="${s.hotel ? `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}` : placeUrl(s)}" target="_blank" rel="noopener" style="color:inherit">map</a></div>
        ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}
      </div></div></li>`;
  }).join("");
  $("#tl").querySelectorAll(".stop").forEach(el => {
    const n = +el.dataset.n;
            el.addEventListener("keydown", e => { if (e.key === "Enter") el.click(); });
        el.addEventListener("click", e => { if (e.target.closest("a")) return; highlight(n); centerOn(day.stops[n - 1]); });
  });
}

/* ---------- map: Google (or OpenStreetMap) base layer, our markers + routes on top ---------- */
let cur = 0, hl = 0, map = null;
const pins = new Map();             // stop number (0 = hotel) -> pin element
let overlays = [];                  // things drawn for the current day

function pinEl(label, isHotel) {
  const d = document.createElement("div");
  d.className = "pin" + (isHotel === true ? " h" : isHotel === "tbd" ? " tbd" : "");
  d.textContent = label;
  return d;
}
function daySequence(day) {
  const H = TRIP.hotel, seq = [{ p: day.from || H, go: null }, ...day.stops.map(s => ({ p: s, go: s.go }))];
  if (day.back) seq.push({ p: H, go: day.back });
  return seq;
}
function onPinClick(n) {
  highlight(n);
  document.querySelector(`.stop[data-n="${n}"]`)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
}

const GoogleBase = {
  init() {
    return new Promise((resolve, reject) => {
      window.__gmReady = resolve;
      const s = document.createElement("script");
      s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GOOGLE_MAPS_API_KEY)}&v=weekly&libraries=marker&loading=async&callback=__gmReady`;
      s.async = true; s.onerror = reject;
      document.head.appendChild(s);
    }).then(() => {
      map = new google.maps.Map($("#map"), { center: { lat: 48.8566, lng: 2.3522 }, zoom: 13, mapId: GOOGLE_MAP_ID,
        disableDefaultUI: true, zoomControl: true, gestureHandling: "cooperative", clickableIcons: false });
    });
  },
  clear() { overlays.forEach(o => o.setMap ? o.setMap(null) : (o.map = null)); overlays = []; },
  line(a, b, color, walk, faded) {
    const opts = { path: [{ lat: a.lat, lng: a.lon }, { lat: b.lat, lng: b.lon }], map, strokeColor: walk ? "#5d6863" : color, strokeWeight: 5, strokeOpacity: faded ? .45 : .95 };
    if (walk) Object.assign(opts, { strokeOpacity: 0, icons: [{ icon: { path: "M 0,-1 0,1", strokeOpacity: faded ? .5 : .9, strokeWeight: 4, scale: 2 }, offset: "0", repeat: "12px" }] });
    overlays.push(new google.maps.Polyline(opts));
  },
  marker(p, el, n) {
    const m = new google.maps.marker.AdvancedMarkerElement({ map, position: { lat: p.lat, lng: p.lon }, content: el, title: n ? p.name : TRIP.hotel.name, zIndex: n });
    if (n) el.addEventListener("click", () => onPinClick(n));
    overlays.push(m);
  },
  fit(pts) {
    const b = new google.maps.LatLngBounds(); pts.forEach(p => b.extend({ lat: p.lat, lng: p.lon }));
    map.fitBounds(b, 48);
  },
  focus(p) { map.panTo({ lat: p.lat, lng: p.lon }); if (map.getZoom() < 15) map.setZoom(16); }
};

const OsmBase = {
  init() {
    map = L.map("map", { zoomControl: true, scrollWheelZoom: false }).setView([48.8566, 2.3522], 13);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
      maxZoom: 19, subdomains: "abcd",
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(map);
    return Promise.resolve();
  },
  clear() { overlays.forEach(o => o.remove()); overlays = []; },
  line(a, b, color, walk, faded) {
    overlays.push(L.polyline([[a.lat, a.lon], [b.lat, b.lon]], { color: walk ? "#5d6863" : color, weight: walk ? 4 : 5,
      opacity: faded ? .45 : .95, dashArray: walk ? "1 9" : null, lineCap: "round" }).addTo(map));
  },
  marker(p, el, n) {
    const m = L.marker([p.lat, p.lon], { icon: L.divIcon({ html: el, className: "", iconSize: [28, 28], iconAnchor: [14, 14] }),
      title: n ? p.name : TRIP.hotel.name, zIndexOffset: n * 10, keyboard: true }).addTo(map);
    if (n) m.on("click", () => onPinClick(n));
    overlays.push(m);
  },
  fit(pts) { map.fitBounds(pts.map(p => [p.lat, p.lon]), { padding: [36, 36] }); },
  focus(p) { map.setView([p.lat, p.lon], Math.max(map.getZoom(), 16)); }
};

let base = null;
/* Google calls this if the key is rejected (bad key, API not enabled, wrong website restriction):
   swap in the OpenStreetMap base map so the page never shows a broken map. */
window.gm_authFailure = () => {
  console.warn("Google Maps rejected the API key; using OpenStreetMap instead.");
  const old = $("#map"), fresh = document.createElement("div");
  fresh.id = "map"; fresh.setAttribute("role", "region"); fresh.setAttribute("aria-label", old.getAttribute("aria-label"));
  old.replaceWith(fresh); overlays = []; base = null;
  OsmBase.init().then(() => { base = OsmBase; drawDay(); fitDay(); });
};
const mapReady = (GOOGLE_MAPS_API_KEY ? GoogleBase.init().then(() => GoogleBase) : Promise.reject())
  .catch(() => OsmBase.init().then(() => OsmBase))
  .then(b => { base = b; drawDay(); fitDay(); })
  .catch(err => { $("#map").textContent = "The map could not load. Check your connection and reload the page."; console.error(err); });

function drawDay() {
  if (!base) return;
  const day = TRIP.days[cur], seq = daySequence(day);
  base.clear(); pins.clear();
  for (let i = 1; i < seq.length; i++)
    base.line(seq[i - 1].p, seq[i].p, legColor(seq[i].go), !legColor(seq[i].go), day.back && i === seq.length - 1);
  const hp = pinEl("H", true); pins.set(0, hp); base.marker(TRIP.hotel, hp, 0);
  if (day.from) base.marker(day.from, pinEl(day.from.pin || "▸", true), 0);
  day.stops.forEach((s, i) => { if (s.hotel) return; const el = pinEl(stopLabel(day, i), s.tbd ? "tbd" : false); pins.set(i + 1, el); base.marker(s, el, i + 1); });
  pins.forEach((el, n) => el.classList.toggle("hl", n === hl && n > 0));
}
function centerOn(p) { base?.focus(p); }
function highlight(n) {
  hl = n;
  document.querySelectorAll(".stop").forEach(e => e.classList.toggle("hl", +e.dataset.n === n));
  pins.forEach((el, k) => el.classList.toggle("hl", k === n && n > 0));
}
function fitDay() { const d = TRIP.days[cur]; base?.fit([TRIP.hotel, ...(d.from ? [d.from] : []), ...d.stops]); }
$("#zfit").addEventListener("click", () => { highlight(0); fitDay(); });

/* ---------- select a day ---------- */
function select(i, animate = true) {
  cur = i; hl = 0;
  tabs.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-selected", j === i));
  renderTimeline(TRIP.days[i]);
  drawDay();
  fitDay();
  const d = TRIP.days[i];
  $("#gmaps").href = routeUrl([d.from || TRIP.hotel, ...d.stops.map(x => x.hotel ? TRIP.hotel : x), ...(d.back ? [TRIP.hotel] : [])]);
  $("#sample").hidden = !d.sample;
  try { localStorage.setItem("paris-day", i); } catch (e) {}
  try { history.replaceState(null, "", "#day" + (i + 1)); } catch (e) {}
}

let start = 0;
const m = location.hash.match(/^#day(\d+)$/);
if (m && +m[1] >= 1 && +m[1] <= TRIP.days.length) start = +m[1] - 1;
else { try { const v = +localStorage.getItem("paris-day"); if (v >= 0 && v < TRIP.days.length) start = v; } catch (e) {} }
select(start, false);
</script>
